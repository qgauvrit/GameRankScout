name: CI

# Every push and every pull request. The ingest workflow runs on a schedule and
# does not run the suite, so before this existed nothing checked a commit at all
# — including the extraction precision gate the ranking's quality rests on.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Type check and lint before the suite: a type error explains a hundred
      # test failures, and reading it first is cheaper than reading them.
      - name: Lint and type check
        run: npm run lint

      # No network: adapters and the scoring function run against recorded
      # fixtures, and the precision gate reads a committed catalogue (KTD8).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
