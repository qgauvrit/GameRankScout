# Deployment manifest for the site and the on-demand community fetch (U13, KTD7).
#
# One Worker serves both. The static build is uploaded as assets and served
# without invoking any code; `/adhoc` is the single path routed through the
# handler. That co-location is what makes the on-demand fetch same-origin, so
# the app reaches it at a relative path with no build-time URL and no CORS
# grant — see `src/app/adhoc/client.ts`.
#
# The browser cannot reach any of GRS's sources directly — none of them send
# cross-origin headers — so this function is what makes a reader-added community
# usable before the next scheduled run. The app degrades without it (it says the
# community will wait for the next run), so this is not on the critical path,
# but a function that cannot be deployed is a function that never runs.
#
# The free tier's per-invocation CPU ceiling is the binding constraint the
# handler is written against: it parses at most one page of entries and returns
# fewer rather than failing.
#
# The name is the left-hand label of the public hostname:
# `<name>.<account-subdomain>.workers.dev`. The account subdomain is already
# `gamerankscout`, so naming the Worker that too would read
# `gamerankscout.gamerankscout.workers.dev` — hence `app`, which gives
# `app.gamerankscout.workers.dev` and keeps the project's name where it belongs.
#
# It is not the handler's name either: this Worker serves the whole site, and
# `/adhoc` is one path within it. Renaming after a deploy mints a different URL
# and orphans the first one, so this is settled before the first deploy rather
# than after.
name = "app"
main = "worker/adhoc.ts"
compatibility_date = "2026-07-01"

# The site's own origin until a custom domain exists. This was a problem while
# the handler was deployed alone — it put the function on a different origin
# from the app — and stops being one now that the app is served from here too.
workers_dev = true

# No KV, no D1, no secrets. The handler holds a short-lived in-memory cache per
# isolate and talks only to the hosts hard-coded in its allowlist, so there is
# nothing here to configure and nothing to leak.

# The ceiling on `/adhoc`, which is the only path here that costs anything to
# serve: it is public, unauthenticated, and makes an outbound request to a
# source that rate-limits us in turn on every cache miss.
#
# It lives in the manifest and not in a dashboard rule because a WAF
# rate-limiting rule attaches to a zone, and `workers.dev` is Cloudflare's zone
# rather than this account's — there is no zone here to attach one to until a
# custom domain exists. `[[unsafe.bindings]]` is how the rate-limiting binding
# is declared while the API is in beta; `unsafe` names the stability of the
# interface, not the safety of the rule.
#
# The unit here is requests, and one reader action is not one request. Adding a
# community fetches every ranking window for it — `RANKING_WINDOWS.length`, four
# today — and the app re-pulls all of the reader's communities whenever a corpus
# loads, concurrently (`pullCommunity` in `src/app/App.tsx`). So a page load
# costs four requests per added community, and a ceiling that counts communities
# would throttle an ordinary reader on a healthy deployment. A hundred a minute
# is twenty-five communities in one burst, well past what anyone curates by hand.
#
# It bounds a burst from one address, not a determined distributed abuser — for
# that the free tier's own request budget is the backstop, and `run_worker_first`
# returns 429 once it is spent. `worker/adhoc.ts` refuses the request outright if
# this binding ever stops being delivered, and a test pins this limit against the
# window count so adding a fifth window cannot quietly halve the headroom.
[[unsafe.bindings]]
name = "ADHOC_RATE_LIMIT"
type = "ratelimit"
# Account-local identifier for the limiter, not a secret and not a resource that
# has to be created first. Changing it resets the counters.
namespace_id = "1001"
simple = { limit = 100, period = 60 }

[assets]
directory = "./dist"
binding = "ASSETS"
# A single-page app owns its own routing, so an unknown path has to reach the
# shell rather than a 404 the reader cannot act on.
not_found_handling = "single-page-application"
# The routing authority. Everything outside this list is served straight from
# the asset store: unbilled, unlimited, and without spending an invocation of
# the free tier's request budget on a file that never changes. Keep this in
# step with `ADHOC_PATH` in `worker/config.ts`.
run_worker_first = ["/adhoc"]

[observability]
enabled = true
